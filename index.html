<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español Fácil · آموزش اسپانیایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--c:#fff;--t:#222;--m:#777;--a:#b03a2e;--line:#e4e0d6}
body.dark{--bg:#1b1d22;--c:#2a2d35;--t:#eee;--m:#aaa;--line:#3a3e48}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t);max-width:720px}
h1{font-size:1.4rem;margin:4px 0}h1 small{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--m);font-size:.85rem}
h2{margin:14px 0 6px;font-size:1.2rem}
.fa{font-family:Vazirmatn,Tahoma,sans-serif}
body.nofa .fa{display:none}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.stats{display:flex;gap:12px;font-size:.9rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
nav button{flex:1;min-width:90px}
nav button.on{background:var(--a);color:#fff}
.bar{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--m);margin-bottom:10px;align-items:center}
select,input[type=text]{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--c);color:var(--t);font-size:1rem}
input[type=text]{width:100%}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--c);color:var(--t);cursor:pointer;font-size:.95rem}
button:hover{border-color:var(--a)}
button.ghost{border-style:dashed}
button:disabled{cursor:default}
.card{background:var(--c);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.click{cursor:pointer}
.row{background:var(--c);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.es{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.tr{margin-top:3px}
.en{color:var(--m)}
.big{font-size:1.7rem;font-weight:700;text-align:center;padding:12px}
.sp{padding:2px 8px;font-size:.85rem}
.note{background:var(--c);border-left:4px solid var(--a);padding:8px 12px;border-radius:6px;font-size:.92rem}
.muted{color:var(--m);font-size:.9rem}
.flash{background:var(--c);border:2px solid var(--line);border-radius:16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.btns{display:flex;gap:10px;margin-top:12px}.btns button{flex:1}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.good{background:#2e8b57;color:#fff;border-color:#2e8b57}
.opt.bad{background:var(--a);color:#fff;border-color:var(--a)}
.bar2{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar2 div{height:100%;background:var(--a)}
.stats2{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.stats2 div{flex:1;background:var(--c);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.fb{margin:10px 0;font-weight:700}
.ph{font-family:'Doulos SIL','Charis SIL',Georgia,serif;font-size:.85rem;color:var(--m);font-weight:400}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:90%;text-align:center}
</style>
</head>
<body>
<header class="top">
  <h1>Español Fácil <small>· آموزش اسپانیایی</small></h1>
  <div class="stats"><span>⭐ XP <b id="xp">0</b></span><span>🔥 <b id="streak">0</b> days</span></div>
</header>
<nav id="tabs">
  <button data-t="learn" onclick="setTab('learn')">📘 Learn</button>
  <button data-t="cards" onclick="setTab('cards')">🃏 Cards</button>
  <button data-t="quiz" onclick="setTab('quiz')">❓ Quiz</button>
  <button data-t="type" onclick="setTab('type')">⌨️ Type</button>
  <button data-t="search" onclick="setTab('search')">🔍 Search</button>
  <button data-t="sounds" onclick="setTab('sounds')">🗣 Sounds</button>
  <button data-t="progress" onclick="setTab('progress')">📊 Progress</button>
</nav>
<div class="bar">
  <label>Practice level <select id="lv" onchange="st.lvl=this.value;setTab(st.tab)">
    <option value="all">All unlocked</option><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option>
  </select></label>
  <label><input type="checkbox" checked onchange="document.body.classList.toggle('nofa',!this.checked)"> Persian</label>
  <label><input type="checkbox" onchange="document.body.classList.toggle('dark',this.checked)"> Dark</label>
  <label><input type="checkbox" id="acc" checked> Ignore accents</label>
  <button onclick="speak('Hola, ¿cómo estás?')">🔈 Test audio</button>
</div>
<main id="main"></main>

tente, no puedo':'poɾ ˈmas ke lo in.ˈten.te no ˈpwe.ðo','Estar hecho polvo':'es.ˈtaɾ ˈe.tʃo ˈpol.βo','Dar en el clavo':'daɾ en el ˈkla.βo','Ser pan comido':'seɾ pan ko.ˈmi.ðo','No tener pelos en la lengua':'no te.ˈneɾ ˈpe.los en la ˈleŋ.gwa','Estar en la luna':'es.ˈtaɾ en la ˈlu.na','Ni siquiera':'ni ˈsi.kje.ɾa','Al fin y al cabo':'al fin i al ˈka.βo','Pese a todo':'ˈpe.se a ˈto.ðo','Dicho sea de paso':'ˈdi.tʃo ˈse.a de ˈpa.so','Cabe destacar que':'ˈka.βe des.ta.ˈkaɾ ke','La brecha digital':'la ˈbɾe.tʃa di.xi.ˈtal','Un tema candente':'un ˈte.ma kan.ˈden.te','Poner en tela de juicio':'po.ˈneɾ en ˈte.la de ˈxwi.sjo','Sentar precedente':'sen.ˈtaɾ pɾe.se.ˈden.te','Hacer hincapié en':'a.ˈseɾ in.ka.ˈpje en','Me tomó por sorpresa':'me to.ˈmo poɾ soɾ.ˈpɾe.sa','Pasar por alto':'pa.ˈsaɾ poɾ ˈal.to','Con creces':'kon ˈkɾe.ses','Tirar la casa por la ventana':'ti.ˈɾaɾ la ˈka.sa poɾ la ben.ˈta.na','Hacerse el sueco':'a.ˈseɾ.se el ˈswe.ko','De no haber sido por ti, habría fracasado':'de no a.ˈβeɾ ˈsi.ðo poɾ ti, a.ˈβɾi.a fɾa.ka.ˈsa.ðo','Lo que es peor':'lo ke es pe.ˈoɾ','Ni más ni menos':'ni ˈmas ni ˈme.nos','Bien que mal':'ˈbjen ke ˈmal','Estar en vilo':'es.ˈtaɾ en ˈbi.lo','Cabe señalar':'ˈka.βe se.ɲa.ˈlaɾ','Resulta imprescindible':'re.ˈsul.ta im.pɾes.ˈsin.di.βle','Sería conveniente revisar el plan':'se.ˈɾi.a kon.βe.ˈnjen.te ɾe.βi.ˈsaɾ el ˈplan','Según reza el informe':'se.ˈɣun ˈre.sa el in.ˈfoɾ.me','Se trata de un asunto delicado':'se ˈtɾa.ta de un a.ˈsun.to de.li.ˈka.ðo','Vos sabés':'bos sa.ˈβes','¿Qué onda?':'ke ˈon.da','Está de chamba':'es.ˈta de ˈtʃam.ba','Chévere':'ˈtʃe.βe.ɾe','Guay':'ɣwaj'};
const SND=[['a','/a/','like «ا» in آب (short, pure, never glides)','agua'],['e','/e/','like «ِ» in بِله (short, clean)','bien'],['i','/i/','like «ی» in ایران (ee)','sí'],['o','/o/','like «ُ» in گُل (pure o, no «او» glide)','oso'],['u','/u/','like «و» in دور (oo)','uno'],['j, g before e/i','/x/','like «خ» in خانه (throat sound)','jamón'],['ñ','/ɲ/','like «ny» in canyon (no exact Persian match)','año'],['ll, y','/ʝ/','like «ی» in یار (usually y)','llama'],['rr','/r/','strong rolled r, like Persian ر in trilled speech','perro'],['r','/ɾ/','one quick tap, like Persian ر in رفتن','pero'],['c before e/i, z','/s/ (Latin America) or /θ/ (Spain)','like «س» (Latin America); Spain uses a soft «th»','cine'],['b, v','/b/','both letters sound the same, soft «ب»','vamos'],['h','silent','never pronounced','hola'],['qu','/k/','«ک»; the u is silent','queso'],['ch','/tʃ/','like «چ» in چای','chico'],['x','/ks/','like «کس»','examen']];
const L=[];
LEVELS.forEach(lv=>lv.lessons.forEach(x=>{const i=L.length;L.push({i,c:lv.c,t:x.t,g:x.g,w:x.w.map((v,k)=>({id:i+'.'+k,es:v[0],en:v[1],fa:v[2]}))})}));

const $=id=>document.getElementById(id);
let S;try{S=JSON.parse(localStorage.getItem('espanol-v2'))}catch(e){}
S=Object.assign({pass:{},known:{},xp:0,streak:0,last:''},S||{});
const st={tab:'learn',li:null,test:null,lvl:'all',deck:[],di:0,flip:false,qs:[],qi:0,qscore:0,qpick:null,tword:null,tmode:'fa',thint:0,tfb:'',search:''};

function save(){try{localStorage.setItem('espanol-v2',JSON.stringify(S))}catch(e){}}
function passed(i){return (S.pass[i]||0)>=80}
function unlocked(i){return i===0||passed(i-1)}
function pool(){return L.filter(x=>unlocked(x.i)&&(st.lvl==='all'||x.c===st.lvl)).flatMap(x=>x.w)}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1])}
function xp(n){S.xp+=n;const today=new Date().toDateString();if(S.last!==today){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=today}save()}
let VOICE=null,KEEP=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();VOICE=v.find(x=>/^es[-_](ES|MX|US)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function speak(t){
 if(!('speechSynthesis' in window)){toast('Audio is not supported in this browser.');return}
 if(!VOICE&&speechSynthesis.getVoices().length)pickVoice();
 const u=new SpeechSynthesisUtterance(t);KEEP=u;u.lang='es-ES';if(VOICE)u.voice=VOICE;u.rate=.8;
 u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Audio failed. Check the volume, or install a Spanish voice on your device.')};
 if(!VOICE&&speechSynthesis.getVoices().length)toast('No Spanish voice on this device; using the default voice.');
 speechSynthesis.cancel();speechSynthesis.resume();setTimeout(()=>speechSynthesis.speak(u),60);
}
function row(w){return `<div class="row"><div class="es">${w.es}${PH[w.es]?` <span class="ph">/${PH[w.es]}/</span>`:''}<button class="sp" data-s="${w.es}" onclick="speak(this.dataset.s)">🔊</button></div><div class="tr"><span class="en">(${w.en})</span> <span class="fa" dir="rtl">${w.fa}</span></div></div>`}

function learnView(){
 if(st.test)return testView();
 if(st.li===null){
  return LEVELS.map(lv=>`<h2>${lv.c} · ${lv.n}</h2>`+L.filter(x=>x.c===lv.c).map(x=>{
   const ok=unlocked(x.i),ic=passed(x.i)?'✅':ok?'▶':'🔒';
   return `<div class="card ${ok?'click':''}" ${ok?`onclick="st.li=${x.i};render()"`:''} style="${ok?'':'opacity:.55'}"><b>${ic} ${x.t}</b><div class="muted">${x.w.length} phrases${S.pass[x.i]?` · best ${S.pass[x.i]}%`:''}${ok?'':' · pass the previous lesson to unlock'}</div></div>`}).join('')).join('');
 }
 const x=L[st.li];
 return `<button class="ghost" onclick="st.li=null;render()">← All lessons</button><div class="muted" style="margin-top:8px">Level ${x.c}</div><h2>${x.t}</h2><p class="note">📘 ${x.g}</p>`+x.w.map(row).join('')+`<button onclick="startTest(${x.i})" style="margin-top:10px">📝 Lesson test (80% to pass)</button>`;
}

function startTest(i){
 const words=L[i].w,all=L.filter(x=>x.c===L[i].c).flatMap(x=>x.w);
 st.test={i,k:0,score:0,pick:null,qs:shuffle(words).map(w=>{const rev=Math.random()<.4;const d=shuffle(all.filter(x=>x.id!==w.id)).slice(0,3).map(x=>rev?x.es:x.en);return {w,rev,a:rev?w.es:w.en,opts:shuffle([rev?w.es:w.en,...d])}})};
 render();
}
function testView(){
 const T=st.test;
 if(T.k>=T.qs.length){const p=Math.round(T.score/T.qs.length*100);return `<h2>${p}% ${p>=80?'🎉 Passed! Next lesson unlocked':'Not yet. You need 80%.'}</h2><p class="muted">${T.score} of ${T.qs.length} correct</p><button onclick="startTest(${T.i})">🔁 Retry test</button> <button class="ghost" onclick="st.test=null;render()">Back to lesson</button>`}
 const q=T.qs[T.k],done=T.pick!==null;
 return `<p class="muted">${L[T.i].t} · question ${T.k+1}/${T.qs.length}</p><div class="card"><div class="big">${q.rev?q.w.en:q.w.es}</div>${q.rev?'':`<button class="sp" data-s="${q.w.es}" onclick="speak(this.dataset.s)">🔊</button>`}</div>`+
 q.opts.map(o=>{let c='';if(done){if(o===q.a)c='good';else if(o===T.pick)c='bad'}return `<button class="opt ${c}" ${done?'disabled':''} data-o="${o}" onclick="pickT(this.dataset.o)">${o}</button>`}).join('')+
 (done?`<div class="fb">${T.pick===q.a?'✅ Correct':'❌ Answer: '+q.a}</div><p class="fa" dir="rtl">${q.w.fa}</p><button onclick="nextT()">Next →</button>`:'');
}
function pickT(o){const T=st.test;if(T.pick!==null)return;T.pick=o;if(o===T.qs[T.k].a)T.score++;render()}
function nextT(){
 const T=st.test;T.k++;T.pick=null;
 if(T.k>=T.qs.length){const p=Math.round(T.score/T.qs.length*100);const was=passed(T.i);S.pass[T.i]=Math.max(S.pass[T.i]||0,p);if(p>=80&&!was)xp(30);save()}
 render();
}

function cardsView(){
 if(!st.deck.length)return '<p>Unlock a lesson to practise cards.</p>';
 const w=st.deck[st.di];
 const face=st.flip?`<div class="en">(${w.en})</div><div class="fa big" dir="rtl">${w.fa}</div>`:`<div class="big">${w.es}</div><div class="ph" style="text-align:center">/${PH[w.es]||''}/</div><button class="sp" data-s="${w.es}" onclick="event.stopPropagation();speak(this.dataset.s)">🔊 Listen</button><div class="muted">Tap to reveal</div>`;
 return `<div class="top"><span class="muted">${st.di+1}/${st.deck.length}</span><button onclick="setTab('cards')">🔀 Shuffle</button></div><div class="flash click" onclick="st.flip=!st.flip;render()">${face}</div><div class="btns"><button onclick="rate(false)">🔁 Review again</button><button onclick="rate(true)">✅ I know it (+2 XP)</button></div>`;
}
function rate(k){const w=st.deck[st.di];if(k){S.known[w.id]=1;xp(2)}st.di=(st.di+1)%st.deck.length;st.flip=false;save();render()}

function startQuiz(){const p=shuffle(pool());st.qs=p.slice(0,Math.min(10,p.length)).map(w=>({w,opts:shuffle([w.en,...shuffle(p.filter(x=>x.id!==w.id)).slice(0,3).map(x=>x.en)])}));st.qi=0;st.qscore=0;st.qpick=null}
function quizView(){
 if(!st.qs.length)return '<p>Unlock a lesson to practise.</p>';
 if(st.qi>=st.qs.length)return `<h2>Score: ${st.qscore}/${st.qs.length}</h2><button onclick="startQuiz();render()">🔁 New quiz</button>`;
 const q=st.qs[st.qi],done=st.qpick!==null;
 return `<p class="muted">Question ${st.qi+1}/${st.qs.length} · Score ${st.qscore}</p><div class="card"><div class="big">${q.w.es}</div><button class="sp" data-s="${q.w.es}" onclick="speak(this.dataset.s)">🔊</button></div>`+
 q.opts.map(o=>{let c='';if(done){if(o===q.w.en)c='good';else if(o===st.qpick)c='bad'}return `<button class="opt ${c}" ${done?'disabled':''} data-o="${o}" onclick="pickQ(this.dataset.o)">${o}</button>`}).join('')+
 (done?`<p class="fa" dir="rtl">${q.w.fa}</p><button onclick="st.qi++;st.qpick=null;render()">Next →</button>`:'');
}
function pickQ(o){if(st.qpick!==null)return;st.qpick=o;if(o===st.qs[st.qi].w.en){st.qscore++;xp(5)}render()}

function nextType(){const p=pool();st.tword=p[Math.floor(Math.random()*p.length)];st.tmode=Math.random()<.5?'fa':'en';st.thint=0;st.tfb=''}
function typeView(){
 const w=st.tword;if(!w)return '<p>Unlock a lesson to practise.</p>';
 const prompt=st.tmode==='fa'?`<div class="fa big" dir="rtl">${w.fa}</div>`:`<div class="big">${w.en}</div>`;
 return `<p class="muted">Type the Spanish for:</p><div class="card">${prompt}</div><input type="text" id="tin" placeholder="Escribe aquí… (type here)" autocomplete="off" onkeydown="if(event.key==='Enter')checkT()"><div class="btns"><button onclick="hintT()">💡 Hint</button><button onclick="checkT()">Check</button><button onclick="nextType();render()">Next →</button></div><div class="fb">${st.tfb}</div>${st.thint?`<p class="muted">Hint: ${w.es.slice(0,st.thint)}…</p>`:''}`;
}
const norm=s=>{let x=s.trim().toLowerCase().replace(/[¿?¡!.,]/g,'').replace(/\s+/g,' ');return $('acc').checked?x.normalize('NFD').replace(/[\u0300-\u036f]/g,''):x};
function checkT(){const v=$('tin')?$('tin').value:'',w=st.tword;if(!v||st.tfb)return;const ok=norm(v)===norm(w.es);st.tfb=ok?'✅ Correct! +5 XP':'❌ Answer: '+w.es;if(ok)xp(5);render()}
function hintT(){st.thint=Math.min(st.thint+1,st.tword.es.length);render()}

function searchView(){return `<input type="text" placeholder="Search Spanish, English or Persian…" value="${st.search}" oninput="st.search=this.value;$('res').innerHTML=results()"><div id="res">${results()}</div>`}
function results(){const q=st.search.trim().toLowerCase();if(!q)return '<p class="muted">Type to search all phrases.</p>';const r=L.flatMap(x=>x.w).filter(w=>[w.es,w.en,w.fa].some(v=>v.toLowerCase().includes(q)));return r.length?r.slice(0,40).map(row).join(''):'<p class="muted">No matches.</p>'}

function progressView(){
 const rows=LEVELS.map(lv=>{const ls=L.filter(x=>x.c===lv.c),n=ls.filter(x=>passed(x.i)).length,p=Math.round(n/ls.length*100);return `<div class="card"><b>${lv.c} · ${lv.n}</b><div class="bar2"><div style="width:${p}%"></div></div><div class="muted">${n}/${ls.length} lessons passed</div></div>`}).join('');
 const words=L.filter(x=>passed(x.i)).reduce((a,x)=>a+x.w.length,0);
 return `<div class="stats2"><div>⭐ ${S.xp} XP</div><div>🔥 ${S.streak} day streak</div><div>📚 ${words} phrases learned</div></div>${rows}<p class="muted">Pass each lesson test with 80% or more to unlock the next one. Practise 15 minutes a day.</p><button class="ghost" onclick="if(confirm('Reset all progress?')){S={pass:{},known:{},xp:0,streak:0,last:''};save();render()}">Reset progress</button>`;
}

function soundsView(){
 return `<h2>Spanish sounds for Persian speakers</h2><p class="note">Spanish is almost fully phonetic: each letter has one sound, and vowels are short and pure. Tap 🔊 to hear each example.</p>`+
 SND.map(s=>`<div class="row"><div class="es">${s[0]} <span class="ph">${s[1]}</span> <button class="sp" data-s="${s[3]}" onclick="speak(this.dataset.s)">🔊 ${s[3]}</button></div><div class="tr">${s[2]}</div></div>`).join('')+
 `<h2>Stress rules</h2><p class="note">Words ending in a vowel, n or s stress the second-to-last syllable: CA-sa, HA-blan. Other endings stress the last syllable: us-TED, es-pa-ÑOL. A written accent mark overrides this, as in está or ¿Qué?</p>`;
}
function setTab(t){
 st.tab=t;
 if(t==='cards'){st.deck=shuffle(pool());st.di=0;st.flip=false}
 if(t==='quiz')startQuiz();
 if(t==='type')nextType();
 render();
}
function render(){
